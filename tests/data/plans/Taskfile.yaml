version: 3

silent: true

tasks:
  generate:
    desc: Generate diff plan for directory, expects target folder with terraform files and terraform.tfstate
    cmds:
      - terraform -chdir={{.DIR}}/initial init
      - terraform -chdir={{.DIR}}/initial apply -state-out=../terraform.tfstate -auto-approve
      - terraform -chdir={{.DIR}}/target init
      - terraform -chdir={{.DIR}}/target plan -state=../terraform.tfstate -out=../terraform.tfplan
      - terraform -chdir={{.DIR}}/target show -json ../terraform.tfplan | jq > {{.DIR}}/terraform.tfplan.json
    status:
      - find "{{.DIR}}/terraform.tfplan.json"
    requires:
      vars: ["DIR"]

  generate_all:
    desc: For each directory in the plans folder, generate a plan
    cmds:
      - for: { var: DIRS, as: DIR }
        task: generate
        vars: { DIR: "{{.DIR}}" }
    vars:
      DIRS:
        sh: find {{.TASKFILE_DIR}} -type d -depth 1 | grep -v artificial

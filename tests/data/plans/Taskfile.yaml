version: 3

silent: true

tasks:
  _generate:
    internal: true
    set: [pipefail]
    cmds:
      - "{{.CLI}} -chdir={{.DIR}}/initial init"
      - "{{.CLI}} -chdir={{.DIR}}/initial apply -state-out=../{{.TOOL}}.tfstate -auto-approve"
      - "{{.CLI}} -chdir={{.DIR}}/target init"
      - "{{.CLI}} -chdir={{.DIR}}/target plan -state=../{{.TOOL}}.tfstate -out=../{{.TOOL}}.tfplan"
      - "{{.CLI}} -chdir={{.DIR}}/target show -json ../{{.TOOL}}.tfplan | jq > {{.DIR}}/{{.TOOL}}.tfplan.json"
    status:
      - test -s "{{.DIR}}/{{.TOOL}}.tfplan.json"
    requires:
      vars: ["DIR", "TOOL", "CLI"]

  generate:
    desc: Generate terraform and opentofu diff plans for directory, expects initial and target folders with terraform files
    cmds:
      - task: _generate
        vars: { DIR: "{{.DIR}}", TOOL: terraform, CLI: terraform }
      - task: _generate
        vars: { DIR: "{{.DIR}}", TOOL: opentofu, CLI: tofu }
    requires:
      vars: ["DIR"]

  generate_all:
    desc: For each directory in the plans folder, generate plans
    cmds:
      - for: { var: DIRS, as: DIR }
        task: generate
        vars: { DIR: "{{.DIR}}" }
    vars:
      DIRS:
        sh: find {{.TASKFILE_DIR}} -type d -depth 1 | grep -v artificial

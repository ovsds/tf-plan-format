version: 3

silent: true

includes:
  tests-data-plans:
    internal: true
    taskfile: tests/data/plans

  build:
    taskfile: build

vars:
  NENV: "node_modules"

  LLVM_TARGET_COVERAGE: "97"

tasks:
  _prettier:
    internal: true
    cmds:
      - "{{.NENV}}/.bin/prettier {{.COMMAND}}"

  init:
    desc: Initialize project environment
    cmds:
      - echo 'Installing mise tools...'
      - mise install

      - echo 'Installing node dependencies...'
      - npm install

      - echo 'Installing husky pre-commit...'
      - npm run prepare

  lint:
    desc: Lint project
    cmds:
      - echo 'Running prettier checks...'
      - task: _prettier
        vars: { COMMAND: "--check ." }

      - echo 'Running GHA checks...'
      - GH_TOKEN="$(gh auth token)" zizmor .

      - echo 'Running cargo checks...'
      - cargo check
      - cargo fmt -- --check
      - cargo clippy

      - echo 'Running compile checks...'
      - cargo rustc

  lint-fix:
    desc: Lint fix project
    cmds:
      - echo 'Running prettier fixes...'
      - task: _prettier
        vars: { COMMAND: "--write ." }

      - echo 'Running GHA checks...'
      - GH_TOKEN="$(gh auth token)" zizmor .

      - echo 'Running cargo fixes...'
      - cargo check
      - cargo fmt
      - cargo clippy

      - echo 'Running compile fixes...'
      - cargo fix --allow-staged --allow-dirty

  build:
    desc: Build project
    cmds:
      - echo 'Building project...'
      - cargo build {{.CLI_ARGS}}

  run:
    desc: Run cargo
    cmds:
      - echo 'Running project...'
      - cargo run -- {{.CLI_ARGS}}

  test:
    desc: Test project
    cmds:
      - echo 'Running tests...'
      - cargo test
        {{if .NAME}} {{.NAME}}{{end}}
        -- --nocapture {{.CLI_ARGS}}
    vars:
      NAME: '{{.NAME | default ""}}'

  test-coverage:
    desc: Test project with coverage
    cmds:
      - cargo llvm-cov test --fail-under-lines={{.LLVM_TARGET_COVERAGE}}

  test-coverage-html:
    desc: Open coverage report in browser
    cmds:
      - cargo llvm-cov --open

  test-generate-data:
    desc: Generate test data
    cmds:
      - echo 'Generating test data...'
      - task: tests-data-plans:generate_all

  clean:
    desc: Clean project environment
    cmds:
      - echo 'Cleaning node dependencies...'
      - rm -rf {{.NENV}}

      - echo 'Cleaning cargo cache...'
      - cargo clean

  dependencies-update:
    desc: Update dependencies
    cmds:
      - echo 'Updating mise tools...'
      - mise upgrade --bump

      - echo 'Updating node dependencies...'
      - npm update

      - echo 'Updating cargo dependencies...'
      - cargo update

  dependencies-check:
    desc: Check dependencies
    cmds:
      - echo 'Checking mise tools...'
      - mise outdated

      - echo 'Checking node dependencies...'
      - npm outdated
      - npm audit

  update-from-template:
    desc: Update project from template
    cmds:
      - echo 'Updating project from template...'
      - cookiecutter
        --no-input
        --overwrite-if-exists
        --output-dir ../
        {{.TEMPLATE_PATH}}
        project_name='Terraform Plan Format'
        project_slug='tf-plan-format'
        node_version='v21.5.0'
        github_workflow_runs_on='ubuntu-latest'
        owner_name='Dmitry Ovsiannikov'
        owner_github_login='ovsds'
        scripts='false'
        services=''
        with_python='false'
        with_cookiecutter='false'
        with_trivy='false'
        with_zizmor='true'
        with_docker='false'
        with_build='true'
    vars:
      TEMPLATE_PATH: '{{.TEMPLATE_PATH | default "https://github.com/ovsds/template-repository"}}'

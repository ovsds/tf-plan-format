name: Release PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - build/**
      - mise.toml
      - trivy.yaml
      - .github/actions/**
      - .github/workflows/release-pr.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  release-pr:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: $/.github/actions/setup_environment

      - name: Configure Docker Builder
        run: mise run configure-builder

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Image Data
        id: get-image-data
        env:
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          IMAGE_NAME: ${{ github.event.repository.name }}-beta
          IMAGE_VERSION: ${{ github.event.number }}-${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "registry=${IMAGE_REGISTRY}"
            echo "name=${IMAGE_NAME}"
            echo "tag=${IMAGE_VERSION}"
            echo "image-tag=${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build binaries and images
        run: mise run //build:all
        env:
          IMAGE_TAG: ${{ steps.get-image-data.outputs.image-tag }}
          GHA_CACHE: true

      - name: Scan image
        id: scan
        uses: ovsds/run-with-output-action@9bc0dcb1df5b70d1704c709f9cc0f40d260a5f40 # v1.4.0
        continue-on-error: true
        with:
          run: |
            IMAGE_REGISTRY="${{ steps.get-image-data.outputs.registry }}" \
            IMAGE_NAME="${{ steps.get-image-data.outputs.name }}" \
            IMAGE_TAG="${{ steps.get-image-data.outputs.tag }}" \
            mise run ci-image-scan

      - name: Report vulnerabilities
        uses: ovsds/create-or-update-unique-comment-action@df30f5f96aa71679deb9eb697c98f39ee9e26651 # v1.1.0
        with:
          issue-number: ${{ github.event.number }}
          body: |
            ## Vulnerabilities found
            ```
            ${{ steps.scan.outputs.stdout }}
            ```
          unique-body-includes: "## Vulnerabilities found"
          delete: ${{ steps.scan.outputs.exit_code == 0 }}

      - name: Release binaries
        id: release-binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries
          path: build/bin

      - name: Comment on PR
        uses: ovsds/create-or-update-unique-comment-action@df30f5f96aa71679deb9eb697c98f39ee9e26651 # v1.1.0
        with:
          issue-number: ${{ github.event.number }}
          body: |
            Build Artifacts:
              - Binaries: [download](${{ steps.release-binaries.outputs.artifact-url }})
              - Image Tag: `${{ steps.get-image-data.outputs.image-tag }}`
          unique-body-includes: |
            Build Artifacts:

name: Release PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - build/**
      - Taskfile.yaml
      - mise.toml
      - .github/actions/**
      - .github/workflows/release-pr.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  release-pr:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: $/.github/actions/setup_environment

      - name: Configure Docker Builder
        run: task build:configure-builder

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Image Tag
        id: get-image-tag
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-beta
          IMAGE_VERSION: ${{ github.event.number }}-${{ github.event.pull_request.head.sha }}
        run: echo "image-tag=${IMAGE_NAME}:${IMAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build binaries and images
        run: task build:all
        env:
          IMAGE_TAG: ${{ steps.get-image-tag.outputs.image-tag }}
          GHA_CACHE: true

      - name: Release binaries
        id: release-binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries
          path: build/bin

      - name: Comment on PR
        uses: ovsds/create-or-update-unique-comment-action@df30f5f96aa71679deb9eb697c98f39ee9e26651 # v1.1.0
        with:
          issue-number: ${{ github.event.number }}
          body: |
            Build Artifacts:
              - Binaries: [download](${{ steps.release-binaries.outputs.artifact-url }})
              - Image Tag: `${{ steps.get-image-tag.outputs.image-tag }}`
          unique-body-includes: |
            Build Artifacts:

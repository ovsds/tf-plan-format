name: Release PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  release-pr:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: $/.github/actions/setup_environment

      - name: Configure Docker Builder
        run: task build:configure-builder

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Image Tag
        id: get-image-tag
        run: echo "image-tag=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-beta:${{ github.event.number }}-${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build binaries and images
        run: task build:all
        env:
          IMAGE_TAG: ${{ steps.get-image-tag.outputs.image-tag }}

      - name: Release binaries
        id: release-binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: build/bin

      - name: Comment on PR
        uses: ovsds/create-or-update-unique-comment-action@df30f5f96aa71679deb9eb697c98f39ee9e26651 # v1.1.0
        with:
          issue-number: ${{ github.event.number }}
          body: |
            Build Artifacts:
              - Binaries: [download](${{ steps.release-binaries.outputs.artifact-url }})
              - Image Tag: `${{ steps.get-image-tag.outputs.image-tag }}`
          unique-body-includes: |
            Build Artifacts:
